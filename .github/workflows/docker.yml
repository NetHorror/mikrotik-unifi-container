name: Publish Docker image
on:
  push:
    branches:
      - 'main'
      - 'hotfix/*'
    tags:
      - '*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  TEST_TAG: nethorror/mikrotik-unifi-container:test
  PKGURL: https://dl.ui.com/unifi/10.6.101/unifi_sysvinit_all.deb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
      - name: Test image
        run: |
          export PKGURL=${{env.PKGURL}} &&
          docker run -d --env PKGURL --rm --name unifitest ${{env.TEST_TAG}} &&
          sleep 35 &&
          for i in $(seq 1 10); do [ $(docker inspect --format='{{json .State.Health.Status}}' unifitest ) == \"healthy\" ] && break ||  sleep 35; done &&
          [ $(docker inspect --format='{{json .State.Health.Status}}' unifitest ) == \"healthy\" ] &&
          docker stop unifitest
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          images: |
            ghcr.io/${{ github.repository }}
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          platforms: linux/arm64/v8,linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} 
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Determine pinned UniFi version
        id: version
        run: |
          VERSION=$(grep -oP 'ARG PKGURL=.*/unifi/\K[0-9.]+(?=/unifi_sysvinit_all\.deb)' Dockerfile)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build arm64 image for manual download
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/arm64/v8
          tags: mikrotik-unifi-container:arm64-export

      - name: Export arm64 image as a RouterOS-loadable tarball
        run: |
          docker save mikrotik-unifi-container:arm64-export | gzip \
            > "mikrotik-unifi-container-${{ steps.version.outputs.version }}-arm64.tar.gz"

      - name: Attach tarball to the matching GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "mikrotik-unifi-container-${VERSION}-arm64.tar.gz" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "No GitHub release found for ${VERSION}, skipping asset upload."
          fi
