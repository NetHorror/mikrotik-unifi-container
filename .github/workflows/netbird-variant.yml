name: Publish UniFi + NetBird variant

# Publishes the NetBird-enabled variant of the UniFi image into the same package as the main image.
# Tags: <unifi>-netbird<netbird> (pinned) and netbird (latest variant). The main "latest" tag is not touched.
# Runs daily after the UniFi update and rebuilds when the UniFi version (Dockerfile PKGURL)
# or the latest NetBird release changes. If the pinned tag already exists, nothing is rebuilt.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: publish-unifi-netbird-variant
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nethorror/mikrotik-unifi-container

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          UNIFI=$(grep -oP 'ARG PKGURL=.*/unifi/\K[0-9.]+(?=/unifi_sysvinit_all\.deb)' Dockerfile)
          NB=$(curl -fsSL https://api.github.com/repos/netbirdio/netbird/releases/latest \
                | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          echo "unifi=${UNIFI}" >> "$GITHUB_OUTPUT"
          echo "netbird=${NB}" >> "$GITHUB_OUTPUT"
          echo "tag=${UNIFI}-netbird${NB}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version pair is already published
        id: exists
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./netbird
          file: ./netbird/Dockerfile
          provenance: false
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UNIFI_VERSION=${{ steps.v.outputs.unifi }}
            NETBIRD_VERSION=${{ steps.v.outputs.netbird }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
            ${{ env.IMAGE }}:netbird
          labels: |
            org.opencontainers.image.title=mikrotik-unifi-container
            org.opencontainers.image.description=UniFi Network Application ${{ steps.v.outputs.unifi }} with NetBird client ${{ steps.v.outputs.netbird }} for RouterOS containers
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
