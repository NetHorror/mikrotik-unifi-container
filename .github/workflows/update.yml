name: Update UniFi Network Application from RSS

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-unifi-network-application
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update-unifi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        id: update
        run: |
          set -euo pipefail
          VERSION=$(./.github/scripts/unifi-updater.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: git_diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly to main
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update UniFi Network Application to v${{ steps.update.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub release
        if: steps.git_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.update.outputs.version }}" \
            --target main \
            --title "UniFi Network Application ${{ steps.update.outputs.version }} — Docker image for RouterOS" \
            --notes-file "${RUNNER_TEMP}/unifi-release-notes.md"

      - name: Trigger image build
        if: steps.git_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --ref main
          gh workflow run docker.yml --ref "${{ steps.update.outputs.version }}"
